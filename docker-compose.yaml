services:
  php:
    image: php:8.2-apache
    container_name: daddeh-php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    ports:
      - "8000:80"
    networks:
      - test_demo_network
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DATABASE_URL=mysql://cosplay_user:cosplay_pass@mysql:3306/CosplayCouture
    command: bash -c "docker-php-ext-install pdo_mysql && a2enmod rewrite && apache2-foreground"

  mysql:
    image: mysql:8.0
    container_name: daddeh-mysql-1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: CosplayCouture
      MYSQL_USER: cosplay_user
      MYSQL_PASSWORD: cosplay_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - test_demo_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - test_demo_network

volumes:
  mysql_data:

networks:
  test_demo_network:
