# Security routes
app_home:
    path: /
    controller: App\Controller\SecurityController::index

app_about:
    path: /about
    controller: App\Controller\SecurityController::about

app_contact:
    path: /contact
    controller: App\Controller\SecurityController::contact
    
app_login:
    path: /login
    controller: App\Controller\SecurityController::login
    
# API Email Verification routes
api_verify_email:
    path: /api/verify-email
    controller: App\Controller\ApiEmailVerificationController::verifyEmail
    methods: [POST]

api_resend_verification:
    path: /api/resend-verification
    controller: App\Controller\ApiEmailVerificationController::resendVerification
    methods: [POST]

api_verification_status:
    path: /api/verification-status
    controller: App\Controller\ApiEmailVerificationController::verificationStatus
    methods: [GET] 

# Google OAuth routes
connect_google:
    path: /connect/google
    controller: App\Controller\GoogleController::connectGoogle
    methods: [GET]

connect_google_check:
    path: /connect/google/check
    controller: App\Controller\GoogleController::connectGoogleCheck
    methods: [GET, POST]

    # Registration routes
app_register:
    path: /register
    controller: App\Controller\RegistrationController::register

app_verify_email:
    path: /verify-email
    controller: App\Controller\EmailVerificationController::verifyUserEmail
    methods: [GET]

app_logout:
    path: /logout
    controller: App\Controller\SecurityController::logout
    methods: [GET]
    
admin_dashboard:
    path: /admin
    controller: App\Controller\AdminController::index

admin_profile:
    path: /admin/profile
    controller: App\Controller\AdminController::profile

admin_change_password:
    path: /admin/change-password
    controller: App\Controller\AdminController::changePassword
    methods: [GET, POST]

admin_users_index:
    path: /admin/users
    controller: App\Controller\AdminController::usersIndex

admin_users_new:
    path: /admin/users/new
    controller: App\Controller\AdminController::usersNew
    methods: [GET, POST]

admin_users_edit:
    path: /admin/users/{id}/edit
    controller: App\Controller\AdminController::usersEdit
    methods: [GET, POST]

admin_users_reset_password:
    path: /admin/users/{id}/reset-password
    controller: App\Controller\AdminController::usersResetPassword
    methods: [GET, POST]

admin_users_delete:
    path: /admin/users/{id}/delete
    controller: App\Controller\AdminController::usersDelete
    methods: [POST]

admin_activity_logs:
    path: /admin/activity-logs
    controller: App\Controller\AdminController::activityLogs
    
app_staff_index:
    path: /staff
