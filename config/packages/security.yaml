security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_STAFF: ROLE_USER
        ROLE_ADMIN: [ROLE_STAFF, ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api(?!/(login|google-login|register))
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                success_handler: App\Security\AuthenticationSuccessHandler
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/api/login,            roles: PUBLIC_ACCESS }
        - { path: ^/api/google-login,     roles: PUBLIC_ACCESS }
        - { path: ^/api/register,         roles: PUBLIC_ACCESS }
        - { path: ^/api/costumes,         roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/orders,           roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/custom-orders,    roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/dashboard,        roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api,                  roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/login,                roles: PUBLIC_ACCESS }
        - { path: ^/register,             roles: PUBLIC_ACCESS }
        - { path: ^/verify-email,         roles: PUBLIC_ACCESS }
        - { path: ^/connect/google,       roles: PUBLIC_ACCESS }
        - { path: ^/connect/google/check, roles: PUBLIC_ACCESS }
        - { path: ^/about,                roles: PUBLIC_ACCESS }
        - { path: ^/contact,              roles: PUBLIC_ACCESS }
        - { path: ^/admin/messages,       roles: ROLE_STAFF }
        - { path: ^/admin,                roles: ROLE_ADMIN }
        - { path: ^/staff,                roles: ROLE_STAFF }
        - { path: ^/costume,              roles: ROLE_ADMIN }
        - { path: ^/custom-order/admin,   roles: ROLE_ADMIN }
        - { path: ^/custom-order,         roles: ROLE_STAFF }
        - { path: ^/order,                roles: ROLE_STAFF }
        - { path: ^/report,               roles: ROLE_ADMIN }
        - { path: ^/delivery,             roles: ROLE_ADMIN }
        - { path: ^/$,                    roles: PUBLIC_ACCESS }
        - { path: ^/,                     roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/orders,           roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/orders,           roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/admin,            roles: ROLE_ADMIN }
        - { path: ^/api/save-fcm-token,   roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/messages,         roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/admin/messages,   roles: ROLE_ADMIN }